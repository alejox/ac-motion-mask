name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag' || github.ref_name == 'main'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

          # On main: release the version declared in buildspec.json, once.
          if [[ "${GITHUB_REF_TYPE}" == 'branch' ]]; then
            version="$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/buildspec.json" | jq -r '.version')"
            if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              && ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${version}" > /dev/null 2>&1; then
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${version}" >> $GITHUB_OUTPUT
            else
              echo 'validTag=false' >> $GITHUB_OUTPUT
            fi
          fi

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Checkout Repository 🛒
        if: fromJSON(steps.check.outputs.validTag)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Create Plugin Archives 📦
        # What people copy to their plugins folder by hand and what the plugin's updater
        # downloads: <name>-<version>-macos.zip (the .plugin bundle) and
        # <name>-<version>-linux-x86_64.tar.gz (<name>/bin/64bit/<name>.so + <name>/data).
        # The Windows zip from the build already has the <name>/bin/64bit + <name>/data shape.
        if: fromJSON(steps.check.outputs.validTag)
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          : Create Plugin Archives 📦
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s nullglob
          name="$(jq -r '.name' repo/buildspec.json)"

          for pkg in *-macos-universal.pkg; do
            python3 -I repo/.github/scripts/pkg-to-plugin-zip.py "${pkg}" "${name}-${VERSION}-macos.zip"
            unzip -l "${name}-${VERSION}-macos.zip"
          done

          for deb in *-x86_64-linux-gnu.deb; do
            rm -rf deb-root linux-package
            dpkg-deb -x "${deb}" deb-root
            mkdir -p "linux-package/${name}/bin/64bit"
            cp deb-root/usr/lib/*/obs-plugins/"${name}".so "linux-package/${name}/bin/64bit/"
            cp -r deb-root/usr/share/obs/obs-plugins/"${name}" "linux-package/${name}/data"
            tar -czf "${name}-${VERSION}-linux-x86_64.tar.gz" -C linux-package "${name}"
            tar -tzf "${name}-${VERSION}-linux-x86_64.tar.gz"
            rm -rf deb-root linux-package
          done

      - name: Release Notes And Checksums 🪪
        # The notes come from the "## <version>" section of CHANGELOG.md ("### Español" and
        # "### English" lists): the plugin shows them before updating and after restarting.
        if: fromJSON(steps.check.outputs.validTag)
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          : Release Notes And Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob nullglob

          awk -v v="## ${VERSION}" '$0==v{on=1;next} /^## /{on=0} on' repo/CHANGELOG.md > NOTES.md
          if ! grep -q '[^[:space:]]' NOTES.md; then
            echo "Release ${VERSION}" > NOTES.md
          fi
          cat NOTES.md

          sha256sum -- @(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.tar.gz|*.zip) > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: false
          target_commitish: ${{ github.sha }}
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/NOTES.md
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz
            ${{ github.workspace }}/*.tar.gz
            ${{ github.workspace }}/SHA256SUMS
